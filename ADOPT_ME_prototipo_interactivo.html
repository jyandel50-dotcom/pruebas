<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADOPT ME — Prototipo interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --cream:#FAF6EF;
  --cream-2:#F1EAE0;
  --dark:#2E1D14;
  --dark-2:#3D281C;
  --orange:#E06D3B;
  --orange-2:#C85A2C;
  --orange-tint:#FBE4D8;
  --taupe:#8C827A;
  --taupe-tint:#EAE6E1;
  --white:#FFFFFF;
  --font-display:'Plus Jakarta Sans',sans-serif;
  --font-body:'Inter',sans-serif;
  --radius:20px;
  --radius-sm:12px;
  --radius-pill:999px;
  --shadow:0 10px 30px rgba(46,29,20,0.08);
  --shadow-lg:0 20px 50px rgba(46,29,20,0.16);
  --maxw:1180px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--cream);color:var(--dark);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--dark);margin:0;line-height:1.12;letter-spacing:-0.01em;}
p{margin:0;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-body);cursor:pointer;}
ul{margin:0;padding:0;list-style:none;}
img,svg{display:block;}
:focus-visible{outline:2px solid var(--orange-2);outline-offset:2px;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
@media(max-width:640px){.wrap{padding:0 18px;}}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--radius-pill);padding:13px 24px;font-weight:700;font-size:15px;font-family:var(--font-display);transition:transform .15s ease, box-shadow .15s ease, background .15s ease;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--orange);color:var(--white);box-shadow:0 6px 16px rgba(224,109,59,.35);}
.btn-primary:hover{background:var(--orange-2);}
.btn-dark{background:var(--dark);color:var(--cream);}
.btn-dark:hover{background:var(--dark-2);}
.btn-outline{background:transparent;color:var(--dark);border:1.5px solid var(--taupe);}
.btn-outline:hover{border-color:var(--dark);}
.btn-ghost{background:transparent;color:var(--dark);padding:10px 14px;}
.btn-ghost:hover{background:var(--taupe-tint);}
.btn-sm{padding:9px 16px;font-size:13px;}
.btn-danger{background:var(--dark);color:var(--orange-tint);}
.btn-block{width:100%;}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--taupe-tint);background:var(--white);display:inline-flex;align-items:center;justify-content:center;color:var(--dark);transition:.15s;}
.icon-btn:hover{border-color:var(--orange);color:var(--orange);}
.icon-btn.active{background:var(--orange);color:var(--white);border-color:var(--orange);}

/* ============ LOGO ============ */
.logo{display:inline-flex;align-items:center;gap:10px;cursor:pointer;}
.logo .wordmark{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em;}
.logo .wordmark .me{color:var(--orange);}
.logo-full{display:flex;flex-direction:column;align-items:center;gap:6px;}
.logo-full .tagline{font-size:11px;letter-spacing:.08em;color:var(--taupe);font-weight:600;}

/* ============ NAVBAR ============ */
.navbar{position:sticky;top:0;z-index:40;background:rgba(250,246,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--taupe-tint);}
.navbar-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:var(--maxw);margin:0 auto;}
.nav-links{display:flex;align-items:center;gap:6px;}
.nav-link{padding:10px 16px;border-radius:var(--radius-pill);font-weight:600;font-size:14.5px;color:var(--dark-2);transition:.15s;}
.nav-link:hover{background:var(--taupe-tint);}
.nav-link.active{background:var(--dark);color:var(--cream);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-burger{display:none;background:none;border:none;color:var(--dark);}
.mobile-menu{display:none;flex-direction:column;gap:4px;padding:12px 18px 20px;border-top:1px solid var(--taupe-tint);}
.mobile-menu.open{display:flex;}
@media(max-width:900px){.nav-links{display:none;}.nav-burger{display:flex;}}

.user-chip{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:var(--radius-pill);background:var(--white);border:1px solid var(--taupe-tint);position:relative;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--orange);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:var(--font-display);}
.chip-name{font-size:13.5px;font-weight:700;}
.chip-role{font-size:11px;color:var(--taupe);text-transform:capitalize;}
.dropdown{position:absolute;top:calc(100% + 10px);right:0;background:var(--white);border:1px solid var(--taupe-tint);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);min-width:200px;padding:8px;display:none;z-index:50;}
.dropdown.open{display:block;}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--dark-2);}
.dropdown-item:hover{background:var(--taupe-tint);}
.notif-badge{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--orange);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--cream);}

/* ============ LAYOUT: sidebar app shell ============ */
.app-shell{display:flex;min-height:calc(100vh - 73px);}
.sidebar{width:250px;flex-shrink:0;background:var(--white);border-right:1px solid var(--taupe-tint);padding:24px 16px;position:sticky;top:73px;height:calc(100vh - 73px);overflow-y:auto;}
.sidebar-section{margin-bottom:22px;}
.sidebar-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--taupe);font-weight:700;padding:0 12px;margin-bottom:8px;}
.side-link{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);font-weight:600;font-size:14.5px;color:var(--dark-2);margin-bottom:2px;transition:.15s;}
.side-link:hover{background:var(--cream-2);}
.side-link.active{background:var(--dark);color:var(--cream);}
.side-link .ic{flex-shrink:0;}
.main-content{flex:1;padding:32px;min-width:0;}
.mobile-sidebar-toggle{display:none;}
@media(max-width:860px){
  .sidebar{position:fixed;left:-270px;top:0;height:100vh;z-index:60;transition:left .2s ease;box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .main-content{padding:20px;}
  .mobile-sidebar-toggle{display:inline-flex;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(46,29,20,.4);z-index:55;}
  .sidebar-backdrop.open{display:block;}
}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
.page-head h1{font-size:28px;}
.page-sub{color:var(--taupe);font-size:14.5px;margin-top:6px;}
.breadcrumb{font-size:13px;color:var(--taupe);margin-bottom:10px;font-weight:600;}
.breadcrumb b{color:var(--dark);}

/* ============ CARDS ============ */
.card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.stat-num{font-family:var(--font-display);font-size:30px;font-weight:800;color:var(--dark);}
.stat-label{font-size:13px;color:var(--taupe);font-weight:600;margin-top:4px;}
.stat-card.accent{background:var(--dark);}
.stat-card.accent .stat-num,.stat-card.accent .stat-label{color:var(--cream);}
.stat-card.accent .stat-label{color:var(--taupe-tint);}

/* ============ PET CARDS ============ */
.pet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media(max-width:980px){.pet-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:620px){.pet-grid{grid-template-columns:1fr;}}
.pet-card{background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease;cursor:pointer;position:relative;}
.pet-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.pet-photo{height:190px;position:relative;overflow:hidden;}
.pet-fav{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;border:none;color:var(--dark);z-index:2;}
.pet-fav.on{color:var(--orange);}
.pet-body{padding:16px 18px 18px;}
.pet-name{font-family:var(--font-display);font-weight:800;font-size:17px;}
.pet-meta{font-size:13px;color:var(--taupe);margin-top:3px;}
.pet-tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.tag{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:var(--radius-pill);background:var(--cream-2);color:var(--dark-2);}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:var(--radius-pill);text-transform:none;}
.badge-disponible{background:var(--orange-tint);color:var(--orange-2);}
.badge-proceso{background:var(--taupe-tint);color:var(--dark-2);}
.badge-adoptado{background:var(--dark);color:var(--cream);}
.badge-pausado{background:var(--taupe-tint);color:var(--taupe);}
.badge-borrador{background:transparent;border:1.5px dashed var(--taupe);color:var(--taupe);}
.badge-pendiente{background:var(--taupe-tint);color:var(--dark-2);}
.badge-aprobada{background:var(--orange-tint);color:var(--orange-2);}
.badge-rechazada{background:var(--dark);color:var(--orange-tint);}
.badge-activo{background:var(--orange-tint);color:var(--orange-2);}
.badge-inactivo{background:var(--taupe-tint);color:var(--taupe);}

/* ============ FORMS ============ */
.field{margin-bottom:18px;}
.field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:7px;color:var(--dark-2);}
.field .hint{font-size:12px;color:var(--taupe);margin-top:6px;}
.field .err{font-size:12px;color:var(--orange-2);margin-top:6px;font-weight:600;display:none;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--orange-2);}
.field.invalid .err{display:block;}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],select,textarea{
  width:100%;padding:13px 15px;border-radius:var(--radius-sm);border:1.5px solid var(--taupe-tint);background:var(--white);font-family:var(--font-body);font-size:14.5px;color:var(--dark);transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--orange);}
textarea{resize:vertical;min-height:90px;}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:560px){.row-2{grid-template-columns:1fr;}}
.checkbox-row{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--dark-2);margin-bottom:12px;line-height:1.5;}
.checkbox-row input{margin-top:3px;accent-color:var(--orange);width:16px;height:16px;flex-shrink:0;}
.pw-wrap{position:relative;}
.pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--taupe);font-size:12px;font-weight:700;}
.seg-tabs{display:flex;background:var(--cream-2);border-radius:var(--radius-pill);padding:4px;margin-bottom:26px;}
.seg-tab{flex:1;text-align:center;padding:10px;border:none;background:none;border-radius:var(--radius-pill);font-weight:700;font-size:14px;color:var(--taupe);}
.seg-tab.active{background:var(--dark);color:var(--cream);}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(46,29,20,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-overlay.open{display:flex;animation:fadeIn .15s ease;}
.modal-box{background:var(--white);border-radius:var(--radius);max-width:460px;width:100%;padding:28px;box-shadow:var(--shadow-lg);animation:popIn .18s ease;}
.modal-box h3{font-size:19px;margin-bottom:10px;}
.modal-box p{color:var(--taupe);font-size:14.5px;margin-bottom:22px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

/* ============ TOAST ============ */
#toast-root{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--dark);color:var(--cream);padding:14px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:slideUp .2s ease;max-width:320px;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;min-width:640px;}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--taupe);padding:16px 18px;border-bottom:1px solid var(--taupe-tint);font-weight:700;}
td{padding:16px 18px;border-bottom:1px solid var(--cream-2);font-size:14px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.row-actions{display:flex;gap:8px;}
.table-empty{padding:60px 20px;text-align:center;color:var(--taupe);}

/* ============ FILTER BAR ============ */
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px;background:var(--white);padding:16px;border-radius:var(--radius);box-shadow:var(--shadow);}
.filter-bar select,.filter-bar input{width:auto;min-width:150px;padding:10px 14px;font-size:13.5px;}
.pill-filters{display:flex;gap:8px;flex-wrap:wrap;}
.pill-f{padding:9px 16px;border-radius:var(--radius-pill);border:1.5px solid var(--taupe-tint);font-size:13.5px;font-weight:700;color:var(--dark-2);background:var(--white);}
.pill-f.active{background:var(--orange);border-color:var(--orange);color:#fff;}

/* ============ LANDING ============ */
.hero{padding:64px 0 40px;}
.hero-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;}}
.eyebrow-pill{display:inline-flex;align-items:center;gap:8px;background:var(--orange-tint);color:var(--orange-2);font-weight:700;font-size:13px;padding:8px 16px;border-radius:var(--radius-pill);margin-bottom:20px;}
.hero h1{font-size:52px;margin-bottom:18px;}
@media(max-width:600px){.hero h1{font-size:34px;}}
.hero p.lead{font-size:17px;color:var(--dark-2);max-width:480px;margin-bottom:28px;}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;}
.hero-stats{display:flex;gap:32px;margin-top:40px;}
.hero-stats div b{display:block;font-family:var(--font-display);font-size:26px;font-weight:800;}
.hero-stats div span{font-size:12.5px;color:var(--taupe);}
.hero-visual{position:relative;height:420px;}
.float-card{position:absolute;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:14px;}
.blob{position:absolute;border-radius:50%;background:var(--orange);opacity:.15;}

.section{padding:60px 0;}
.section-head{max-width:560px;margin-bottom:36px;}
.section-head h2{font-size:32px;margin-bottom:12px;}
.section-head p{color:var(--taupe);font-size:15px;}
.split-2{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
@media(max-width:800px){.split-2{grid-template-columns:1fr;}}
.pp-card{background:var(--white);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);}
.pp-card h3{font-size:18px;margin-bottom:12px;}
.pp-card p{color:var(--taupe);font-size:14.5px;}
.steps-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media(max-width:900px){.steps-row{grid-template-columns:repeat(2,1fr);}}
.step-num{width:42px;height:42px;border-radius:50%;background:var(--dark);color:var(--cream);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;margin-bottom:14px;}
.cta-band{background:var(--dark);border-radius:28px;padding:56px 40px;text-align:center;}
.cta-band h2{color:var(--cream);font-size:30px;margin-bottom:14px;}
.cta-band p{color:var(--taupe-tint);margin-bottom:26px;}
.footer{padding:40px 0;border-top:1px solid var(--taupe-tint);margin-top:20px;}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.footer-links{display:flex;gap:22px;font-size:13.5px;color:var(--taupe);font-weight:600;}

/* ============ AUTH ============ */
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:radial-gradient(circle at 20% 20%, var(--orange-tint), transparent 45%), var(--cream);}
.auth-card{background:var(--white);border-radius:28px;box-shadow:var(--shadow-lg);max-width:460px;width:100%;padding:38px;}
.auth-back{font-size:13.5px;color:var(--taupe);font-weight:700;margin-bottom:18px;display:inline-block;}
.auth-card h1{font-size:24px;text-align:center;margin-bottom:4px;}
.auth-sub{text-align:center;color:var(--taupe);font-size:13.5px;margin-bottom:26px;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--taupe);font-size:12.5px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--taupe-tint);}
.foot-link{text-align:center;font-size:13.5px;color:var(--taupe);margin-top:18px;}
.demo-box{background:var(--cream-2);border-radius:var(--radius-sm);padding:14px;margin-bottom:22px;font-size:12.5px;color:var(--dark-2);}
.demo-box b{display:block;margin-bottom:6px;}
.demo-role-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}

/* ============ DETAIL PAGE ============ */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;}
@media(max-width:860px){.detail-grid{grid-template-columns:1fr;}}
.detail-photo{height:380px;border-radius:var(--radius);overflow:hidden;position:relative;}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:20px 0;}
.info-item{background:var(--cream-2);border-radius:var(--radius-sm);padding:14px;}
.info-item .k{font-size:11.5px;color:var(--taupe);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.info-item .v{font-size:15px;font-weight:700;margin-top:4px;}
.compat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.compat-pill{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:8px 14px;border-radius:var(--radius-pill);}
.compat-yes{background:var(--orange-tint);color:var(--orange-2);}
.compat-no{background:var(--taupe-tint);color:var(--taupe);}

/* ============ TRACKING (stepper) ============ */
.track-steps{display:flex;justify-content:space-between;position:relative;margin:30px 0 10px;}
.track-steps::before{content:'';position:absolute;top:17px;left:0;right:0;height:2px;background:var(--taupe-tint);z-index:0;}
.track-step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;text-align:center;}
.track-dot{width:36px;height:36px;border-radius:50%;background:var(--taupe-tint);color:var(--taupe);display:flex;align-items:center;justify-content:center;font-weight:800;border:4px solid var(--cream);}
.track-dot.done{background:var(--orange);color:#fff;}
.track-dot.rejected{background:var(--dark);color:var(--orange-tint);}
.track-step span{font-size:12.5px;font-weight:700;color:var(--taupe);max-width:90px;}
.track-step.done span{color:var(--dark);}

/* ============ EMPTY STATE ============ */
.empty{text-align:center;padding:70px 20px;}
.empty .ic{font-size:52px;margin-bottom:16px;}
.empty h3{margin-bottom:8px;}
.empty p{color:var(--taupe);font-size:14.5px;margin-bottom:22px;}

/* ============ MISC ============ */
.avatar-lg{width:64px;height:64px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;font-family:var(--font-display);}
.dashed-drop{border:2px dashed var(--taupe-tint);border-radius:var(--radius-sm);padding:30px;text-align:center;color:var(--taupe);font-size:13.5px;}
.tab-strip{display:flex;gap:4px;border-bottom:1px solid var(--taupe-tint);margin-bottom:24px;}
.tab-item{padding:12px 18px;font-weight:700;font-size:14px;color:var(--taupe);border-bottom:2px solid transparent;margin-bottom:-1px;}

.section-title-sm{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--taupe);font-weight:700;margin-bottom:14px;}
.list-line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--cream-2);font-size:14px;}
.list-line:last-child{border-bottom:none;}
.progress-track{height:8px;background:var(--taupe-tint);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--orange);border-radius:99px;}

/* Paleta fija (coincide con los tokens CSS) para que las ilustraciones vivan dentro de la identidad visual */
const PAL = {cream:'#FAF6EF',cream2:'#F1EAE0',dark:'#2E1D14',dark2:'#3D281C',orange:'#E06D3B',orange2:'#C85A2C',orangeTint:'#FBE4D8',taupe:'#8C827A',taupeTint:'#EAE6E1',white:'#FFFFFF'};

function faceGroup(o){
  // o: {earsBack, muzzlePatch, feature, blush}
  const feature = o.feature || PAL.dark;
  return `
    <ellipse cx="100" cy="150" rx="34" ry="7" fill="${PAL.dark}" opacity=".07"/>
    ${o.earsBack||''}
    <circle cx="100" cy="106" r="${o.headR||56}" fill="${o.face}"/>
    ${o.muzzlePatch!==false?`<ellipse cx="100" cy="${o.headR>58?134:128}" rx="24" ry="16" fill="${o.muzzle||PAL.cream}"/>`:''}
    ${o.earsFront||''}
    ${o.blush?`<circle cx="70" cy="118" r="8" fill="${PAL.orangeTint}" opacity=".8"/><circle cx="130" cy="118" r="8" fill="${PAL.orangeTint}" opacity=".8"/>`:''}
    <circle cx="84" cy="${o.eyeY||100}" r="${o.eyeR||5.5}" fill="${feature}"/>
    <circle cx="116" cy="${o.eyeY||100}" r="${o.eyeR||5.5}" fill="${feature}"/>
    <circle cx="86" cy="${(o.eyeY||100)-2}" r="1.6" fill="${PAL.white}"/>
    <circle cx="118" cy="${(o.eyeY||100)-2}" r="1.6" fill="${PAL.white}"/>
    <ellipse cx="100" cy="${o.noseY||122}" rx="5.5" ry="4" fill="${feature}"/>
    <path d="M92 ${(o.noseY||122)+9} Q100 ${(o.noseY||122)+15} 108 ${(o.noseY||122)+9}" stroke="${feature}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    ${o.whiskers?`
    <g stroke="${feature}" stroke-width="1.4" opacity=".55" stroke-linecap="round">
      <path d="M62 118 H40"/><path d="M63 124 H42"/><path d="M63 130 H44"/>
      <path d="M138 118 H160"/><path d="M137 124 H158"/><path d="M137 130 H156"/>
    </g>`:''}
    ${o.collar?`<rect x="68" y="${o.headR>58?150:146}" width="64" height="11" rx="5.5" fill="${o.accent}"/><circle cx="100" cy="${(o.headR>58?156:152)}" r="5" fill="${PAL.cream}"/>`:''}
  `;
}
const ILLUS = {
  dogFloppy(o){
    const earsBack = `<ellipse cx="52" cy="98" rx="22" ry="36" fill="${o.ear}" transform="rotate(-18 52 98)"/><ellipse cx="148" cy="98" rx="22" ry="36" fill="${o.ear}" transform="rotate(18 148 98)"/>`;
    return faceGroup({face:o.face,ear:o.ear,accent:o.accent,earsBack,collar:true,feature:o.feature});
  },
  dogAlert(o){
    const earsBack = `<path d="M58 70 L38 24 L74 60 Z" fill="${o.ear}"/><path d="M142 70 L162 24 L126 60 Z" fill="${o.ear}"/>`;
    return faceGroup({face:o.face,ear:o.ear,accent:o.accent,earsBack,collar:true,feature:o.feature});
  },
  dogPuppy(o){
    const earsBack = `<ellipse cx="58" cy="92" rx="17" ry="26" fill="${o.ear}" transform="rotate(-12 58 92)"/><ellipse cx="142" cy="92" rx="17" ry="26" fill="${o.ear}" transform="rotate(12 142 92)"/>`;
    return faceGroup({face:o.face,ear:o.ear,accent:o.accent,earsBack,headR:60,eyeR:7,eyeY:102,blush:true,collar:true,feature:o.feature});
  },
  dogCurly(o){
    const bumps=[[46,66],[40,96],[48,126],[62,146],[138,146],[152,126],[160,96],[154,66],[70,44],[130,44],[100,36]]
      .map(([x,y])=>`<circle cx="${x}" cy="${y}" r="11" fill="${o.ear}"/>`).join('');
    const earsBack = `<ellipse cx="54" cy="102" rx="18" ry="30" fill="${o.ear}" transform="rotate(-16 54 102)"/><ellipse cx="146" cy="102" rx="18" ry="30" fill="${o.ear}" transform="rotate(16 146 102)"/>${bumps}`;
    return faceGroup({face:o.face,ear:o.ear,accent:o.accent,earsBack,collar:true,feature:o.feature});
  },
  cat(o){
    const earsBack = `<path d="M55 70 L44 26 L82 58 Z" fill="${o.ear}"/><path d="M145 70 L156 26 L118 58 Z" fill="${o.ear}"/>`;
    const earsFront = o.pointed ? `<path d="M58 66 L50 34 L76 58 Z" fill="${o.pointColor}"/><path d="M142 66 L150 34 L124 58 Z" fill="${o.pointColor}"/>` : '';
    const muzzleMask = o.pointed ? `<ellipse cx="100" cy="128" rx="26" ry="18" fill="${o.pointColor}" opacity=".9"/>` : '';
    return `${faceGroup({face:o.face,ear:o.ear,accent:o.accent,earsBack,earsFront:earsFront+muzzleMask,muzzlePatch:!o.pointed,whiskers:true,collar:true,feature:o.feature})}`;
  },
  rabbit(o){
    const earsBack = `
      <ellipse cx="82" cy="34" rx="13" ry="44" fill="${o.ear}" transform="rotate(-8 82 34)"/>
      <ellipse cx="118" cy="34" rx="13" ry="44" fill="${o.ear}" transform="rotate(8 118 34)"/>
      <ellipse cx="82" cy="34" rx="6" ry="34" fill="${PAL.cream}" opacity=".55" transform="rotate(-8 82 34)"/>
      <ellipse cx="118" cy="34" rx="6" ry="34" fill="${PAL.cream}" opacity=".55" transform="rotate(8 118 34)"/>`;
    return faceGroup({face:o.face,ear:o.ear,accent:o.accent,earsBack,headR:52,eyeY:104,whiskers:true,collar:true,feature:o.feature});
  }
};
function petArt(pet){
  const o = pet.art;
  const character = ILLUS[o.variant](o);
  return `<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="${o.bg}"/>
    <g opacity=".08" fill="${o.accent}" transform="translate(150 30) scale(1.1) rotate(18)">
      <ellipse cx="0" cy="0" rx="5" ry="7"/><ellipse cx="10" cy="-6" rx="5.4" ry="7"/><ellipse cx="20" cy="0" rx="5" ry="7"/>
      <path d="M10 8c-8 0-13 5-13 11 0 4.6 3.5 7 7 4.6 1.8-1.2 3.6-1.8 6-1.8s4.2.6 6 1.8c3.5 2.4 7 0 7-4.6 0-6-5-11-13-11z"/>
    </g>
    <g transform="translate(0 -6)">${character}</g>
  </svg>`;
}
function petThumb(pet, size, radius){
  if(!pet) return `<div style="width:${size}px;height:${size}px;border-radius:${radius||'10px'};background:${PAL.cream2};flex-shrink:0"></div>`;
  return `<div style="width:${size}px;height:${size}px;border-radius:${radius||'10px'};overflow:hidden;flex-shrink:0;display:inline-block;vertical-align:middle">${petArt(pet)}</div>`;
}
function defaultArtFor(especie){
  if(especie==='Gato') return {variant:'cat',face:PAL.taupeTint,ear:PAL.dark,accent:PAL.orange,bg:PAL.cream2,feature:PAL.dark};
  if(especie==='Conejo') return {variant:'rabbit',face:PAL.cream2,ear:PAL.taupeTint,accent:PAL.orange2,bg:PAL.taupeTint,feature:PAL.dark};
  return {variant:'dogFloppy',face:PAL.cream2,ear:PAL.orange2,accent:PAL.orange,bg:PAL.orangeTint,feature:PAL.dark};
}

  </svg>`;
}
function Logo(opts){
  opts = opts||{};
  const size = opts.size||36;

}

========================================================= */
function petById(id){return PETS.find(p=>p.id===Number(id));}
function refugioById(id){return REFUGIOS.find(r=>r.id===Number(id));}
function initials(name){return (name||'?').split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();}
function esc(s){return (s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function go(hash){ location.hash = hash; window.scrollTo(0,0); }

/* ---------- Reglas de visibilidad y estado (una sola fuente de verdad) ---------- */
// Clase CSS del badge según el estado de la mascota (antes estaba repetida en 3 vistas).
function estadoBadgeClass(estado){
  return {disponible:'badge-disponible','en proceso':'badge-proceso',adoptado:'badge-adoptado',pausado:'badge-pausado'}[estado] || 'badge-pausado';
}
function refugioActivo(id){ const r = refugioById(id); return !!r && r.estado==='activo'; }
// ¿Aparece en el catálogo público? Debe estar publicada y su refugio no suspendido.
function isPetListed(p){ return !!p && p.pub==='publicado' && refugioActivo(p.refugioId); }
// ¿Puede ver la ficha de esta mascota la persona actual? Admin y refugio dueño ven también borradores y suspendidas.
function canViewPet(p){
  if(!p) return false;
  const u = state.user;
  if(u && u.rol==='admin') return true;
  if(u && u.rol==='refugio' && u.refugioId===p.refugioId) return true;
  return isPetListed(p);
}
function listedAvailablePets(){ return PETS.filter(p=>p.estado==='disponible' && isPetListed(p)); }
// Solicitudes del usuario en sesión: se identifican por id, nunca por nombre.
function myRequests(){ return state.user ? REQUESTS.filter(r=>r.userId===state.user.id) : []; }
// Motivo por el que una cuenta no puede iniciar sesión (null si puede).
function accountBlockReason(rol, id){
  if(rol==='usuario'){
    const u = USERS.find(x=>x.id===id);
    if(u && u.estado!=='activo') return 'Tu cuenta está desactivada. Pide al administrador que la reactive.';
  }
  if(rol==='refugio' && !refugioActivo(id)) return 'Este refugio está suspendido. Contacta al administrador.';
  return null;
}

function toast(msg, kind){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className='toast';
  const iconSvg = TOAST_ICONS[kind] || ic.check;
  el.innerHTML = `<span style="flex-shrink:0;display:flex">${iconSvg}</span><span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
}

function openModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay open" id="active-modal">${html}</div>`;
  document.getElementById('active-modal').addEventListener('click', e=>{ if(e.target.id==='active-modal') closeModal(); });
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function confirmModal({title, body, confirmLabel, danger, onConfirm}){
  openModal(`
    <div class="modal-box">
      <h3>${esc(title)}</h3>
      <p>${esc(body)}</p>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" id="modal-confirm-btn">${esc(confirmLabel||'Confirmar')}</button>
      </div>
    </div>`);
  document.getElementById('modal-confirm-btn').addEventListener('click', ()=>{ closeModal(); onConfirm && onConfirm(); });
}

function requireAuth(roles){
  if(!state.user){ go('#/login'); return false; }
  if(roles && !roles.includes(state.user.rol)){ go('#/404'); return false; }
  return true;
}

function csvDownload(filename, rows){
  const csv = rows.map(r=>r.map(c=>`"${(c+'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  toast('Archivo CSV exportado','download');
}

// Lista del catálogo según filtros activos. Una sola implementación para la vista y la actualización parcial.
function filterCatalogPets(){
  const f = state.catalogFilters;
  let list = PETS.filter(isPetListed);
  if(f.especie) list = list.filter(p=>p.especie===f.especie);
  if(f.tamano) list = list.filter(p=>p.tamano===f.tamano);
  if(f.edad==='joven') list = list.filter(p=>/mes|1 año/.test(p.edad));
  if(f.edad==='adulto') list = list.filter(p=>/[2-4] años/.test(p.edad));
  if(f.edad==='senior') list = list.filter(p=>/[5-9] años/.test(p.edad));
  if(f.q) list = list.filter(p=>p.nombre.toLowerCase().includes(f.q.toLowerCase())||p.raza.toLowerCase().includes(f.q.toLowerCase()));
  return list.filter(p=>state.statusFilter?p.estado===state.statusFilter:p.estado!=='adoptado');
}
function catalogCountText(n){ return `${n} ${n===1?'mascota encontrada':'mascotas encontradas'}`; }
function catalogResultsHtml(list){
  return list.length
    ? `<div class="pet-grid">${list.map(petCard).join('')}</div>`
    : `<div class="empty">${ic.search}<h3 style="margin-top:10px">No encontramos mascotas con esos filtros</h3><p>Intenta ajustar la búsqueda.</p></div>`;
}
function viewCatalogo(){
  const f = state.catalogFilters;
  const list = filterCatalogPets();
  const sel = (cur,val)=>cur===val?'selected':'';
  const content = `
    <div class="page-head"><div><h1>Catálogo de mascotas</h1><p class="page-sub" id="catalog-count">${catalogCountText(list.length)}</p></div></div>
    <div class="filter-bar">
      <input type="text" id="catalog-q" aria-label="Buscar mascotas" placeholder="Buscar por nombre o raza..." value="${esc(f.q)}" oninput="setFilter('q',this.value)" style="min-width:220px">
      <select id="catalog-especie" aria-label="Especie" onchange="setFilter('especie',this.value)">
        <option value="">Especie: todas</option>
        <option ${sel(f.especie,'Perro')}>Perro</option><option ${sel(f.especie,'Gato')}>Gato</option><option ${sel(f.especie,'Conejo')}>Conejo</option>
      </select>
      <select id="catalog-tamano" aria-label="Tamaño" onchange="setFilter('tamano',this.value)">
        <option value="">Tamaño: todos</option>
        <option ${sel(f.tamano,'Pequeño')}>Pequeño</option><option ${sel(f.tamano,'Mediano')}>Mediano</option><option ${sel(f.tamano,'Grande')}>Grande</option>
      </select>
      <select id="catalog-edad" aria-label="Edad" onchange="setFilter('edad',this.value)">
        <option value="">Edad: todas</option>
        <option value="joven" ${sel(f.edad,'joven')}>Joven (0-1 año)</option>
        <option value="adulto" ${sel(f.edad,'adulto')}>Adulto (2-4 años)</option>
        <option value="senior" ${sel(f.edad,'senior')}>Senior (5+ años)</option>
      </select>
    </div>
    <div class="pill-filters" style="margin-bottom:22px">
      ${['disponible','en proceso','pausado'].map(s=>`<button class="pill-f ${state.statusFilter===s?'active':''}" onclick="setStatusFilter('${s}')">${s}</button>`).join('')}
      <button class="pill-f ${!state.statusFilter?'active':''}" onclick="setStatusFilter('')">Todos</button>
    </div>
    <div id="catalog-results">${catalogResultsHtml(list)}</div>
  `;
  if(state.user) return appShell(sidebarForRole(), content);
  return `${topNavbar()}<div class="main-content wrap" style="padding-top:32px">${content}</div>${pageFooter()}`;

// Escribir en el buscador solo actualiza los resultados: el input conserva foco, cursor y texto.
function refreshCatalogResults(){
  const list = filterCatalogPets();
  document.getElementById('catalog-count').textContent = catalogCountText(list.length);
  document.getElementById('catalog-results').innerHTML = catalogResultsHtml(list);
}
function setFilter(k,v){
  state.catalogFilters[k]=v;
  if(k==='q' && document.getElementById('catalog-results')) refreshCatalogResults(); else render();
}
function setStatusFilter(s){ state.statusFilter = s; render(); }
function sidebarForRole(){
  if(!state.user) return '';
  if(state.user.rol==='usuario') return sidebarUsuario();
  if(state.user.rol==='refugio') return sidebarRefugio();
  return sidebarAdmin();
}

// Muestra los datos de contacto registrados. No hay mensajería interna: no se finge un envío.
// kind 'refugio' → id del refugio · kind 'usuario' → id de la solicitud (contacto del solicitante).
function openContactModal(kind, id){
  let nombre = '', persona = '', correo = '', telefono = '';
  if(kind==='refugio'){
    const r = refugioById(id);
    if(r){ nombre=r.nombre; persona=[r.contacto,r.cargo].filter(Boolean).join(' · '); correo=r.correoContacto; telefono=r.telefono; }
  } else {
    const q = REQUESTS.find(x=>x.id===Number(id));
    if(q){ nombre=q.userNombre; correo=q.userEmail; }
  }
  if(!nombre){ toast('No encontramos los datos de contacto','warn'); return; }
  const line = (k,v)=>`<div class="list-line"><span style="color:var(--taupe)">${k}</span><span>${v}</span></div>`;
  openModal(`<div class="modal-box">
    <h3>${ic.msg} Contactar a ${esc(nombre)}</h3>
    <p>La mensajería interna aún no está disponible. Usa estos datos para comunicarte directamente.</p>
    ${persona?line('Contacto',esc(persona)):''}
    ${line('Correo', correo?`<a href="mailto:${esc(correo)}" style="color:var(--orange-2);font-weight:700">${esc(correo)}</a>`:'No registrado')}
    ${telefono?line('Teléfono',`<a href="tel:${esc(telefono.replace(/[^\d+]/g,''))}" style="color:var(--orange-2);font-weight:700">${esc(telefono)}</a>`):''}
    <div class="modal-actions" style="margin-top:20px"><button class="btn btn-outline" onclick="closeModal()">Cerrar</button>
    ${correo?`<a class="btn btn-primary" href="mailto:${esc(correo)}">Escribir un correo</a>`:''}</div>
  </div>`);
}

function submitSolicitud(petId){
  const motivo = document.getElementById('s-motivo').value.trim();
  const compromisos = Array.from(document.querySelectorAll('.s-compromiso'));
  if(!motivo){ toast('Cuéntanos el motivo de tu adopción','warn'); return; }
  if(!compromisos.every(c=>c.checked)){ toast('Debes aceptar todos los compromisos de cuidado','warn'); return; }
  const p = petById(petId);
  // Revalidar al enviar: el estado pudo cambiar mientras el formulario estaba abierto.
  if(!canViewPet(p) || p.estado!=='disponible'){ toast('Esta mascota ya no está disponible','warn'); go('#/mascota/'+petId); return; }
  if(REQUESTS.some(q=>q.petId===petId && q.userId===state.user.id && q.estado==='pendiente')){ toast('Ya tienes una solicitud pendiente para esta mascota','warn'); go('#/seguimiento'); return; }
  const nr = {id:reqSeq++, petId, userId:state.user.id, userNombre:state.user.nombre, userEmail:state.user.email, refugioId:p.refugioId, estado:'pendiente',
    fecha:new Date().toISOString().slice(0,10), motivo,
    vivienda:document.getElementById('s-vivienda').value, patio:document.getElementById('s-patio').checked, tamanoVivienda:document.getElementById('s-tamano').value};
  REQUESTS.push(nr);
  p.estado = p.estado==='disponible' ? 'en proceso' : p.estado;
  toast('¡Solicitud enviada con éxito!','success');
  go('#/seguimiento');
}

function saveMascota(id, pubState){
  const nombre = document.getElementById('f-nombre').value.trim();

  const data = {
    nombre, especie:document.getElementById('f-especie').value, raza:document.getElementById('f-raza').value,
    edad:document.getElementById('f-edad').value, sexo:document.getElementById('f-sexo').value, tamano:document.getElementById('f-tamano').value,
    desc:document.getElementById('f-desc').value, vacunado:document.getElementById('f-vac').checked, esterilizado:document.getElementById('f-est').checked,
    salud:document.getElementById('f-salud').value, ninos:document.getElementById('f-ninos').checked, perros:document.getElementById('f-perros').checked,
    gatos:document.getElementById('f-gatos').checked, pub:pubState
  };
  if(id){
    Object.assign(petById(id), data);
    toast('Mascota actualizada','success');

    PETS.push(Object.assign({id:Math.max(...PETS.map(p=>p.id))+1, refugioId:state.user.refugioId||1, estado:'disponible', art:defaultArtFor(data.especie)}, data));

  }
  go('#/refugio/mascotas');
}

function tryDeleteRefugio(rid){
  const pendientes = REQUESTS.filter(r=>r.refugioId===rid && r.estado==='pendiente');

  confirmModal({title:'Eliminar cuenta del refugio', body:'Esta acción es permanente. ¿Deseas continuar?', confirmLabel:'Eliminar', danger:true, onConfirm:()=>{toast('Cuenta de refugio eliminada','delete'); doLogout();}});

function viewAdminSolicitudes(){
  if(!requireAuth(['admin'])) return '';
  const content = `
    <div class="page-head"><div><h1>Gestión de solicitudes</h1><p class="page-sub">Aprueba o rechaza las solicitudes de adopción registradas</p></div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Solicitante</th><th>Mascota</th><th>Refugio</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody>
      ${REQUESTS.map(r=>{const p=petById(r.petId); const ref=refugioById(r.refugioId);return `
        <tr>
          <td>${esc(r.userNombre)}</td>
          <td style="display:flex;align-items:center;gap:10px">${petThumb(p,32,'8px')}${p?esc(p.nombre):'—'}</td>
          <td>${ref?esc(ref.nombre):''}</td>
          <td>${esc(r.fecha)}</td>
          <td><span class="badge badge-${r.estado}">${r.estado}</span></td>
          <td class="row-actions">
            <button class="icon-btn" title="Ver detalle" onclick="viewReqDetail(${r.id})">${ic.eye}</button>
            ${r.estado==='pendiente'?`
            <button class="icon-btn" title="Aprobar" onclick="approveReq(${r.id})">${ic.check}</button>
            <button class="icon-btn" title="Rechazar" onclick="openRejectModal(${r.id})">${ic.x}</button>`:''}
          </td>
        </tr>`}).join('')}
      </tbody>
    </table></div>
  `;
  return appShell(sidebarAdmin(), content);
}
function approveReq(id){
  const r = REQUESTS.find(x=>x.id===id);
  confirmModal({title:'Aprobar solicitud', body:'La mascota pasará a estado "adoptado" y las demás solicitudes pendientes para esta mascota se rechazarán automáticamente.', confirmLabel:'Aprobar',
    onConfirm:()=>{
      r.estado='aprobada';
      const p = petById(r.petId); p.estado='adoptado';
      REQUESTS.filter(x=>x.petId===r.petId && x.id!==r.id && x.estado==='pendiente').forEach(x=>{x.estado='rechazada'; x.motivoRechazo='La mascota ya fue adoptada por otro solicitante.';});
      toast('Solicitud aprobada y adopción registrada','success'); render();
    }});
}
function openRejectModal(id){
  openModal(`<div class="modal-box">
    <h3>Rechazar solicitud</h3>
    <p>Indica el motivo del rechazo. El solicitante será notificado.</p>
    <div class="field"><textarea id="reject-motivo" placeholder="Ej. Espacio insuficiente para la mascota..."></textarea></div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-danger" onclick="rejectReq(${id})">Rechazar solicitud</button></div>
  </div>`);
}
function rejectReq(id){
  const motivo = document.getElementById('reject-motivo').value.trim();
  if(!motivo){ toast('El motivo de rechazo es obligatorio','warn'); return; }
  const r = REQUESTS.find(x=>x.id===id); r.estado='rechazada'; r.motivoRechazo=motivo;
  closeModal(); toast('Solicitud rechazada','success'); render();
}

      <div class="stat-card"><div class="stat-num">${disponibles.length}</div><div class="stat-label">Mascotas disponibles</div></div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div class="section-title-sm" style="margin:0">Adopciones realizadas</div>
      <button class="btn btn-sm btn-outline" onclick='exportCSV("adopciones")'>${ic.download} Exportar CSV</button></div>
      ${adopciones.map(r=>{const p=petById(r.petId); const ref=refugioById(r.refugioId);return `<div class="list-line"><span>${p?esc(p.nombre):''} → ${esc(r.userNombre)}</span><span style="color:var(--taupe)">${ref?esc(ref.nombre):''} · ${esc(r.fecha)}</span></div>`}).join('')||'<p style="color:var(--taupe);font-size:14px">Sin registros aún.</p>'}
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div class="section-title-sm" style="margin:0">Mascotas disponibles</div>
      <button class="btn btn-sm btn-outline" onclick='exportCSV("mascotas")'>${ic.download} Exportar CSV</button></div>
      ${disponibles.map(p=>{const ref=refugioById(p.refugioId);return `<div class="list-line"><span style="display:flex;align-items:center;gap:10px">${petThumb(p,32,'8px')} ${esc(p.nombre)} · ${esc(p.raza)}</span><span style="color:var(--taupe)">${ref?esc(ref.nombre):''}</span></div>`}).join('')}
    </div>
  `;
  return appShell(sidebarAdmin(), content);
}
function exportCSV(type){
  if(type==='adopciones'){
    const rows = [['Mascota','Adoptante','Refugio','Fecha']].concat(REQUESTS.filter(r=>r.estado==='aprobada').map(r=>{const p=petById(r.petId);const ref=refugioById(r.refugioId);return [p?p.nombre:'',r.userNombre,ref?ref.nombre:'',r.fecha];}));
    csvDownload('adopciones_adoptme.csv', rows);
  } else {
    const rows = [['Nombre','Especie','Raza','Refugio']].concat(PETS.filter(p=>p.estado==='disponible').map(p=>{const ref=refugioById(p.refugioId);return [p.nombre,p.especie,p.raza,ref?ref.nombre:''];}));
    csvDownload('mascotas_disponibles_adoptme.csv', rows);
  }
}

/* =========================================================
   ROUTER
========================================================= */
function parseRoute(){
  const h = location.hash || '#/';
  const parts = h.replace('#/','').split('/').filter(Boolean);
  return parts;
}
let lastRouteKey = null;
function render(){
  const parts = parseRoute();
  const routeKey = parts.join('/');
  const sameRoute = routeKey === lastRouteKey;
  const prevScroll = window.scrollY;
  const appEl = document.getElementById('app');
  const ae = document.activeElement;
  // Si se vuelve a pintar la misma pantalla, se conserva el foco del campo activo y el scroll.
  const focusSnap = (sameRoute && ae && ae.id && appEl.contains(ae)) ? {id:ae.id,start:ae.selectionStart,end:ae.selectionEnd} : null;
  let html;
  const [a,b,c] = parts;
  if(!a) html = viewLanding();
  else if(a==='login') html = viewLogin();
  else if(a==='registro') html = viewRegistro();
  else if(a==='catalogo') html = viewCatalogo();
  else if(a==='mascota' && b) html = viewDetalle(b);
  else if(a==='favoritos') html = viewFavoritos();
  else if(a==='solicitud' && b) html = viewSolicitud(b);
  else if(a==='seguimiento') html = viewSeguimiento();
  else if(a==='perfil') html = viewPerfilUsuario();
  else if(a==='dashboard') html = viewDashboardUsuario();
  else if(a==='notificaciones') html = viewNotificaciones();
  else if(a==='refugio' && b==='dashboard') html = viewDashboardRefugio();
  else if(a==='refugio' && b==='mascotas' && c==='nueva') html = viewFormMascota(null);
  else if(a==='refugio' && b==='mascotas' && c==='editar') html = viewFormMascota(parts[3]);
  else if(a==='refugio' && b==='mascotas') html = viewGestionMascotas();
  else if(a==='refugio' && b==='solicitudes') html = viewSolicitudesRefugio();
  else if(a==='refugio' && b==='perfil') html = viewPerfilRefugio();
  else if(a==='admin' && b==='dashboard') html = viewDashboardAdmin();
  else if(a==='admin' && b==='usuarios') html = viewAdminUsuarios();
  else if(a==='admin' && b==='refugios') html = viewAdminRefugios();
  else if(a==='admin' && b==='solicitudes') html = viewAdminSolicitudes();
  else if(a==='admin' && b==='reportes') html = viewAdminReportes();
  else if(a==='nosotros') html = viewLanding();
  else if(a==='recuperar') html = viewRecuperar();
  else html = view404();

  appEl.innerHTML = html || '';
  lastRouteKey = routeKey;
  if(sameRoute) window.scrollTo(0, prevScroll);
  if(focusSnap){
    const el = document.getElementById(focusSnap.id);
    if(el){ el.focus({preventScroll:true}); try{ if(focusSnap.start!=null) el.setSelectionRange(focusSnap.start,focusSnap.end); }catch(_){} }
  }
  if(a==='nosotros'){ const sec = document.getElementById('sobre-nosotros'); if(sec) sec.scrollIntoView(); }
  document.title = 'ADOPT ME — ' + (a? a.charAt(0).toUpperCase()+a.slice(1) : 'Inicio');
}
function viewRecuperar(){
  return `<div class="auth-shell"><div class="auth-card">
    <a class="auth-back" href="#/login">&larr; Volver a iniciar sesión</a>
    <div style="display:flex;justify-content:center;margin-bottom:14px">${Logo({size:44})}</div>
    <h1>Recuperar contraseña</h1><p class="auth-sub">Te enviaremos un enlace válido por 30 minutos</p>
    <div class="field"><label>Correo electrónico</label><input type="email" placeholder="tucorreo@ejemplo.com"></div>
    <button class="btn btn-primary btn-block" onclick="toast('Enlace de recuperación enviado a tu correo','mail');go('#/login')">Enviar enlace</button>
  </div></div>`;
}

window.addEventListener('hashchange', ()=>{ state.mobileNavOpen=false; state.sidebarOpen=false; state.userDropdownOpen=false; render(); });
document.addEventListener('click', (e)=>{
  const dd = document.getElementById('user-dropdown');
  if(dd && state.userDropdownOpen && !e.target.closest('.user-chip') && !e.target.closest('.dropdown')){ state.userDropdownOpen=false; dd.classList.remove('open'); }
});
render();
</script>
